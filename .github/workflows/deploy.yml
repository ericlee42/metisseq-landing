name: s3-deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  spa_build_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.DEPLOY_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.DEPLOY_AWS_DEFAULT_REGION }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate
        run: npm run check
      - name: Build QA
        run: npm run build:qa
      - name: Build
        run: npm run build
      - name: Deploy
        uses: islishude/spa-deploy-action@v1
        with:
          dir-path: "dist"
          s3-bucket: metis-sequencer-web
          cache-control: |
            {
              "index.html": "no-cache"
            }
