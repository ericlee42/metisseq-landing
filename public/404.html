<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #f8f8f8;
      color: #333;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      text-align: center;
      padding-top: 10%;
      margin: 0;
    }
    h1 {
      font-size: 6em;
      margin-bottom: 0.2em;
    }
    p {
      font-size: 1.5em;
      margin-bottom: 2em;
    }
    a {
      color: #0078d7;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      body {
        padding-top: 20%;
      }
      h1 {
        font-size: 3em;
      }
      p {
        font-size: 1.1em;
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Sorry, the page you are looking for does not exist.</p>
  <a href="/">Go back home</a>
</body>
</html>
